# fly.toml app configuration file generated for sol-live-feed on 2026-11-20T21:25:26Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'sol-live-feed'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
